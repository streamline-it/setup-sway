---
# tasks file for setup-sway

- name: ensure OS-specific variables exist
  ansible.builtin.include_vars: "./vars/{{ ansible_os_family }}.yml"

- name: call tasks to check assertions
  ansible.builtin.include_tasks: asserts.yml

- name: ensure needed packages are installed
  ansible.builtin.include_tasks: install-pkgs.yml

- name: setup wallpaper location
  ansible.builtin.include_tasks: setup-wallpaper.yml

- name: call tasks to setup sway config
  ansible.builtin.include_tasks: setup-sway-config.yml

- name: call tasks to setup user documentation
  ansible.builtin.include_tasks: setup-documentation.yml

- name: call tasks to setup alacritty terminal settings
  ansible.builtin.include_tasks: config-alacritty.yml

- name: add alias to .bashrc
  ansible.builtin.include_tasks: config-alias.yml
